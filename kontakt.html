<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontakt - Rekan Goran</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand mb-0 h1">Rekan Goran</span>
            <div>
                <a href="index.html" class="nav-link-custom">Galleri</a>
                <a href="om.html" class="nav-link-custom">Om mig</a>
                <a href="kontakt.html" class="nav-link-custom active">Kontakt</a>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <h1>Kontakta mig</h1>
        <p>Formuläret nedan är statiskt och skickar ingen data någonstans. Det visar bara hur ett tillgängligt kontaktformulär kan byggas upp.</p>

        <form class="contact-form mt-4" novalidate>
            <div class="mb-3">
                <label for="namn" class="form-label">Namn</label>
                <input type="text" class="form-control" id="namn" name="namn" required>
            </div>

            <div class="mb-3">
                <label for="epost" class="form-label">E-post</label>
                <input type="email" class="form-control" id="epost" name="epost" required aria-describedby="epost-hjalp">
                <div id="epost-hjalp" class="form-text">Används bara för att kunna svara dig.</div>
            </div>

            <div class="mb-3">
                <label for="meddelande" class="form-label">Meddelande</label>
                <textarea class="form-control" id="meddelande" name="meddelande" rows="5" required></textarea>
            </div>

            <button type="submit" class="btn btn-primary">Skicka</button>
        </form>
    </main>

    <footer class="text-center py-4 text-muted">
        <p>&copy; 2026 Rekan Goran</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
